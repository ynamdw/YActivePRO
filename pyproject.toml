[tool.pylint."messages control"]
# Design-size notices are accepted in this single-file server (the
# dispatcher and selftest are deliberately large); keep the rest on.
# consider-using-f-string: the file keeps %-formatting throughout.
# duplicate-code: the selftest intentionally mirrors CLI snippets.
disable = [
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "too-few-public-methods",
    "consider-using-f-string",
    "duplicate-code",
]

[tool.pylint.basic]
# stdlib HTTP handler method names (do_GET, do_POST, ...)
method-rgx = "^[a-z_][a-zA-Z0-9_]{1,30}$"

[tool.flake8]
# The pipx shebang/PEP 723 header keeps the module docstring first and
# the imports at the top; nothing else to ignore.
max-line-length = 79
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
