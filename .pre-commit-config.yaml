---
files: ^(.*\.(py|json|md|sh|yaml|yml|cfg|txt))$
exclude: ^(\.[^/]*cache/.*|demo/.*|debug/.*|.github/ISSUE_TEMPLATE|NOTICE|LICENSE)$
repos:
  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat # Executable to run, with fixed options
        language: python
        types: [markdown]
        exclude: ^(\.github/ISSUE_TEMPLATE.*)$
        args: [--wrap, "75", --number]
        additional_dependencies:
          - mdformat-toc==0.5.0
          - mdformat-beautysh==1.0.0
          - mdformat-config==0.2.1
          - mdformat-gfm==1.0.0
          - setuptools==84.2.1
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      #- id: no-commit-to-branch
      #  args: [--branch, main]
      - id: check-yaml
        # Exclude because of bug in checker
        exclude: ^(docker-compose\.yml|.*/release-drafter\.yml)$
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: mixed-line-ending
      - id: check-builtin-literals
      - id: check-ast
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: pretty-format-json
        exclude: ^(\.vscode|\.devcontainer)
        args:
          # order of keys in manifest.json is "special"
          - --no-sort-keys
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        exclude: ^(.*\.md)$
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --no-warnings
          - -d
          - "{extends: relaxed, rules: {line-length: {max: 90}}}"
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args:
          - --safe
          - --quiet
          - -l 79
  - repo: https://github.com/Lucas-C/pre-commit-hooks-bandit
    rev: v1.0.6
    hooks:
      - id: python-bandit-vulnerability-check
        args: [--skip, "B105,B110,B311,B404,B603", --recursive, apps]
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0 # v2.4.0
    hooks:
      - id: autoflake
        args:
          - -i
          - -r
          - --expand-star-imports
          - .
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        additional_dependencies:
          - pyproject-flake8==7.0.0a1
          - flake8-bugbear==26.11.9
          - flake8-comprehensions==3.17.0
          - flake8_2020==1.8.1
          - mccabe==0.7.0
          - pycodestyle==2.15.0
          - pyflakes==4.1.0
  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [-Ldout]
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        # exclude: ^$
        args:
          - --reports=no
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args:
          - --ignore-missing-imports
          - --install-types
          - --non-interactive
          - --check-untyped-defs
          - --show-error-codes
          - --show-error-context
        #additional_dependencies:
        #  - types-requests
        #  - urllib3
  - repo: https://github.com/lovesegfault/beautysh.git
    rev: v6.4.3
    hooks:
      - id: beautysh
        exclude: (run.sh)$
        additional_dependencies:
          - setuptools
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: ^[^\.].*\.sh$
        args: [--shell, bash]
